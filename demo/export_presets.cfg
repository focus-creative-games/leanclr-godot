[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="managed/native/*.bytes,managed/notices/*.txt"
exclude_filter="managed/wasm/*,managed/native/provenance.json"
export_path="../build/export/native/leanclr-demo.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://../build/templates/windows_release_x86_64.exe"
custom_template/release="res://../build/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/console_wrapper_icon=""

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="managed/wasm/*.bytes,managed/notices/*.txt"
exclude_filter="managed/native/*,managed/wasm/provenance.json"
export_path="../build/export/web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug="res://../build/templates/web_dlink_nothreads_debug.zip"
custom_template/release="res://../build/templates/web_dlink_nothreads_release.zip"
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
threads/emscripten_pool_size=0
threads/godot_pool_size=0
